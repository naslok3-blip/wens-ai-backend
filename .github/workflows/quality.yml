name: Wens Quality Checks
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check worker.js
          node --check app.js
          node --check admin.js
          node --check public/app.js
          node --check public/admin.js
      - name: Verify published assets are in sync
        run: |
          cmp index.html public/index.html
          cmp app.js public/app.js
          cmp style.css public/style.css
          cmp manifest.json public/manifest.json
          cmp admin.html public/admin.html
          cmp admin.js public/admin.js
          cmp admin.css public/admin.css
      - name: Verify production Worker, Workers AI, D1 and static assets
        run: |
          set -euo pipefail
          BASE="https://wens-ai-backend-b142.naqashy1.workers.dev"
          echo "Checking production health and required bindings"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 "$BASE/api/health" -o /tmp/wens-health.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/wens-health.json', encoding='utf-8'))
          features = data.get('features', {})
          assert data.get('ok') is True, f"Worker health failed: {data}"
          assert features.get('workersAI') is True, f"Workers AI binding missing: {features}"
          assert features.get('database') is True, f"D1 binding missing: {features}"
          assert features.get('browser') is True, f"Browser Run binding missing: {features}"
          assert data.get('configured') is True, "No AI service is configured"
          print("Production health: OK")
          print("Cloudflare Workers AI binding: OK")
          print("D1 binding: OK")
          print("LiveKit:", "configured" if features.get('videoAvatar') else "not configured (optional)")
          PY
          echo "Checking D1-backed authentication route without creating a user"
          AUTH_STATUS=$(curl --silent --show-error --connect-timeout 10 --max-time 20 -o /tmp/wens-auth-probe.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -X POST \
            --data '{"email":"quality-probe@invalid.example","password":"not-a-real-account"}' \
            "$BASE/api/auth/login")
          test "$AUTH_STATUS" = "401"
          echo "D1-backed login query: OK (unknown probe account rejected)"
      - name: End-to-end registration and login session test
        if: contains(github.event.head_commit.message, '[registration-e2e]') || contains(github.event.head_commit.message, '[image-agent-e2e]')
        env:
          BASE: https://wens-ai-backend-b142.naqashy1.workers.dev
          CI_EMAIL: wens-e2e-${{ github.run_id }}-${{ github.run_attempt }}@example.invalid
          CI_PASSWORD: Wens-CI-${{ github.run_id }}-${{ github.run_attempt }}-Test!
        run: |
          set -euo pipefail
          echo "Creating isolated CI account"
          REGISTER_STATUS=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            -o /tmp/wens-register.json -w '%{http_code}' -c /tmp/wens-cookie.txt \
            -H 'Content-Type: application/json' -X POST \
            --data "$(python -c 'import json,os; print(json.dumps({"name":"Wens CI Test","email":os.environ["CI_EMAIL"],"password":os.environ["CI_PASSWORD"]}))')" \
            "$BASE/api/auth/register")
          echo "Registration HTTP status: $REGISTER_STATUS"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/wens-register.json',encoding='utf-8'))
          if not data.get('ok'):
              print("Registration error:", data.get('error'))
              print("Registration code:", data.get('code'))
              print("Diagnostic:", data.get('diagnostic'))
              print("Request ID:", data.get('requestId'))
          assert data.get('ok') is True and data.get('user',{}).get('name') == 'Wens CI Test', data
          print("Registration: OK")
          PY
          test "$REGISTER_STATUS" = "200"
          ME_STATUS=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            -o /tmp/wens-me-register.json -w '%{http_code}' -b /tmp/wens-cookie.txt \
            "$BASE/api/auth/me")
          test "$ME_STATUS" = "200"
          python - <<'PY'
          import json
          assert json.load(open('/tmp/wens-me-register.json',encoding='utf-8')).get('ok') is True
          print("Registration session: OK")
          PY
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 -b /tmp/wens-cookie.txt -c /tmp/wens-cookie.txt \
            -H 'Content-Type: application/json' -X POST --data '{}' "$BASE/api/auth/logout" >/dev/null
          LOGIN_STATUS=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            -o /tmp/wens-login.json -w '%{http_code}' -c /tmp/wens-cookie.txt \
            -H 'Content-Type: application/json' -X POST \
            --data "$(python -c 'import json,os; print(json.dumps({"email":os.environ["CI_EMAIL"],"password":os.environ["CI_PASSWORD"]}))')" \
            "$BASE/api/auth/login")
          test "$LOGIN_STATUS" = "200"
          ME_LOGIN_STATUS=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            -o /tmp/wens-me-login.json -w '%{http_code}' -b /tmp/wens-cookie.txt \
            "$BASE/api/auth/me")
          test "$ME_LOGIN_STATUS" = "200"
          python - <<'PY'
          import json
          assert json.load(open('/tmp/wens-login.json',encoding='utf-8')).get('ok') is True
          assert json.load(open('/tmp/wens-me-login.json',encoding='utf-8')).get('ok') is True
          print("Login and session persistence: OK")
          PY
          echo "Testing in-chat AI image generation through the authenticated agent"
          IMAGE_STATUS=$(curl --silent --show-error --connect-timeout 10 --max-time 120 \
            -o /tmp/wens-image-generation.json -w '%{http_code}' -b /tmp/wens-cookie.txt \
            -H 'Content-Type: application/json' -H 'X-Wens-Diagnostics: image-agent-e2e' -X POST \
            --data '{"message":"أنشئي صورة اختبار بسيطة: كوب قهوة أحمر على طاولة بيضاء بإضاءة نهارية، بدون كتابة أو شعارات."}' \
            "$BASE/api/chat")
          echo "Image chat HTTP status: $IMAGE_STATUS"
          if [ "$IMAGE_STATUS" != "200" ]; then
            head -c 1800 /tmp/wens-image-generation.json || true
            echo
            exit 1
          fi
          python - <<'PY'
          import json
          data=json.load(open('/tmp/wens-image-generation.json',encoding='utf-8'))
          images=data.get('generatedImages') or []
          if data.get('ok') is not True or len(images)!=1:
              print("Image agent model:", data.get('model'))
              print("Image agent steps:", data.get('steps'))
              print("Image agent reply:", data.get('reply'))
              print("Image agent error:", data.get('error'))
          assert data.get('ok') is True, data.get('error') or data
          assert len(images)==1, f"Agent did not return exactly one image: {len(images)}"
          assert images[0].get('dataUrl','').startswith('data:image/'), "Generated image data URL missing"
          assert len(images[0]['dataUrl']) > 5000, "Generated image payload is unexpectedly small"
          print("Authenticated agent image generation: OK")
          PY
          echo "Testing in-chat edit of the generated reference image"
          python - <<'PY'
          import json
          generated=json.load(open('/tmp/wens-image-generation.json',encoding='utf-8'))
          data_url=generated['generatedImages'][0]['dataUrl']
          header, image=data_url.split(',',1)
          mime=header.split(';',1)[0].split(':',1)[1]
          payload={
            "message":"عدّلي الصورة المرفقة واجعلي الكوب أزرق بدل الأحمر مع الحفاظ على الخلفية والتكوين.",
            "attachments":[{"kind":"image","name":"wens-ci-reference.jpg","type":mime,"data":image}]
          }
          json.dump(payload,open('/tmp/wens-image-edit-request.json','w',encoding='utf-8'),ensure_ascii=False)
          PY
          EDIT_STATUS=$(curl --silent --show-error --connect-timeout 10 --max-time 150 \
            -o /tmp/wens-image-edit.json -w '%{http_code}' -b /tmp/wens-cookie.txt \
            -H 'Content-Type: application/json' -X POST \
            --data-binary @/tmp/wens-image-edit-request.json "$BASE/api/chat")
          test "$EDIT_STATUS" = "200"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/wens-image-edit.json',encoding='utf-8'))
          images=data.get('generatedImages') or []
          assert data.get('ok') is True, data.get('error') or data
          assert len(images)==1, f"Agent did not return an edited image: {len(images)}"
          assert images[0].get('dataUrl','').startswith('data:image/'), "Edited image data URL missing"
          print("Authenticated agent reference-image editing: OK")
          PY
          DUPLICATE_STATUS=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            -o /tmp/wens-duplicate.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -X POST \
            --data "$(python -c 'import json,os; print(json.dumps({"name":"Wens CI Test","email":os.environ["CI_EMAIL"],"password":os.environ["CI_PASSWORD"]}))')" \
            "$BASE/api/auth/register")
          test "$DUPLICATE_STATUS" = "409"
          echo "Duplicate-email protection: OK"
          echo "CI test account for post-run cleanup: $CI_EMAIL"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 -b /tmp/wens-cookie.txt \
            -H 'Content-Type: application/json' -X POST --data '{}' "$BASE/api/auth/logout" >/dev/null
      - name: Verify deployed HTML, JavaScript, CSS and avatar assets
        run: |
          set -euo pipefail
          BASE="https://wens-ai-backend-b142.naqashy1.workers.dev"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$BASE/" -o /tmp/wens-index.html
          grep -q 'id="chatForm"' /tmp/wens-index.html
          grep -q 'id="openAdminBtn"' /tmp/wens-index.html
          grep -q 'id="adminInlinePanel"' /tmp/wens-index.html
          grep -q 'avatar.jpg' /tmp/wens-index.html
          grep -q 'data-action="camera"' /tmp/wens-index.html
          grep -q 'data-action="photos"' /tmp/wens-index.html
          grep -q 'data-action="files"' /tmp/wens-index.html
          grep -q 'data-action="plugins"' /tmp/wens-index.html
          grep -q 'data-action="deep"' /tmp/wens-index.html
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$BASE/app.js" -o /tmp/wens-app.js
          grep -q 'Cloudflare AI' /tmp/wens-app.js
          grep -q 'updateAdminShortcut' /tmp/wens-app.js
          grep -q 'addSelectedFile' /tmp/wens-app.js
          grep -q 'attachmentPayload' /tmp/wens-app.js
          grep -q 'createImageBitmap' /tmp/wens-app.js
          grep -q 'generatedImages' /tmp/wens-app.js
          grep -q 'runAgentImage' worker.js
          grep -q 'generate_image' worker.js
          grep -q 'edit_image' worker.js
          grep -q '@cf/black-forest-labs/flux-2-klein-4b' worker.js
          grep -q 'reasoning_effort' worker.js
          grep -q 'runOptions.image' worker.js
          grep -q '@cf/qwen/qwen3.8-27b' worker.js
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$BASE/style.css" -o /tmp/wens-style.css
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$BASE/avatar.jpg?v=real-jpg-20261104" -o /tmp/wens-avatar.jpg
          python - <<'PY'
          image = open('/tmp/wens-avatar.jpg', 'rb').read()
          assert image[:3] == bytes.fromhex("ffd8ff"), "Wens portrait is not a valid JPEG asset"
          assert len(image) > 5000, f'Wens portrait unexpectedly small: {len(image)} bytes'
          print(f'Wens portrait JPEG: OK ({len(image)} bytes)')
          PY
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$BASE/admin.html?embed=1" -o /tmp/wens-admin.html
          grep -q 'id="adminSetupForm"' /tmp/wens-admin.html
          grep -q 'id="showAdminResetBtn"' /tmp/wens-admin.html
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$BASE/owner-panel.js" -o /tmp/wens-admin.js
          grep -q '/api/auth/me' /tmp/wens-admin.js
          echo "Production Wens portrait, chat and same-page admin assets: OK"
      - name: Verify owner-only admin and shared settings API
        run: |
          set -euo pipefail
          BASE="https://wens-ai-backend-b142.naqashy1.workers.dev"
          SESSION_STATUS=$(curl --silent --show-error --connect-timeout 10 --max-time 20 -o /tmp/wens-admin-session.json -w '%{http_code}' "$BASE/api/admin/session")
          test "$SESSION_STATUS" = "200"
          node -e 'const d=require("/tmp/wens-admin-session.json"); if(d.configured!==true || d.authenticated!==false) process.exit(1); console.log("Unauthenticated admin session: correctly denied")'
          SETTINGS_STATUS=$(curl --silent --show-error --connect-timeout 10 --max-time 20 -o /tmp/wens-admin-settings.json -w '%{http_code}' "$BASE/api/admin/settings")
          test "$SETTINGS_STATUS" = "401"
          echo "Owner-only settings API: unauthenticated request rejected"
          LOGIN_STATUS=$(curl --silent --show-error --connect-timeout 10 --max-time 20 -o /tmp/wens-admin-login.json -w '%{http_code}' -H 'Content-Type: application/json' -X POST --data '{"email":"quality-probe@invalid.example","password":"not-a-real-password"}' "$BASE/api/admin/login")
          test "$LOGIN_STATUS" = "401"
          echo "Admin login rejects non-owner account"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$BASE/api/settings" -o /tmp/wens-settings.json
          node -e 'const d=require("/tmp/wens-settings.json"); if(!d.settings || typeof d.settings.appName!=="string" || typeof d.settings.enableVoice!=="boolean") process.exit(1); console.log("Shared application settings endpoint: OK")'
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$BASE/owner-panel" -o /tmp/wens-admin.html
          grep -q 'id="adminEmail"' /tmp/wens-admin.html
          grep -q 'id="adminPassword"' /tmp/wens-admin.html
          ! grep -q 'adminPin' /tmp/wens-admin.html
          ! grep -q 'مكالمة فيديو' /tmp/wens-admin.html
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$BASE/owner-panel.js" -o /tmp/wens-admin.js
          grep -q '/api/admin/settings' /tmp/wens-admin.js
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$BASE/app.js" -o /tmp/wens-app.js
          grep -q 'loadServerSettings' /tmp/wens-app.js
          ! grep -Eiq 'cameraBtn|callPanel|livekit|/api/call/token' /tmp/wens-app.js
          echo "Updated admin/app pages and video-call removal: OK"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate D1 migration
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect(':memory:')
          db.executescript(open('migrations/0001_initial.sql', encoding='utf-8').read())
          db.executescript(open('migrations/0002_admin_settings.sql', encoding='utf-8').read())
          expected = {'users', 'sessions', 'messages', 'app_settings'}
          actual = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert expected.issubset(actual), f"Missing tables: {expected - actual}"
          print("D1 schema validated:", ', '.join(sorted(expected)))
          PY
