name: Wens Quality Checks
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check worker.js
          node --check app.js
          node --check admin.js
          node --check public/app.js
          node --check public/admin.js
      - name: Verify published assets are in sync
        run: |
          cmp index.html public/index.html
          cmp app.js public/app.js
          cmp style.css public/style.css
          cmp manifest.json public/manifest.json
      - name: Diagnose all deployed Wens Workers
        continue-on-error: true
        run: |
          for host in wens-ai-backend-b142 wens-aii wens-ai; do
            echo "Checking $host.naqashy1.workers.dev"
            if curl --connect-timeout 10 --max-time 20 -fsS "https://$host.naqashy1.workers.dev/api/health" -o /tmp/wens-health.json; then
              HOST="$host" python - <<'PY'
          import json, os
          data = json.load(open('/tmp/wens-health.json', encoding='utf-8'))
          features = data.get('features', {})
          print('Worker host:', os.environ['HOST'])
          print('Service healthy:', data.get('ok'))
          print('OpenAI key configured:', features.get('openai', data.get('configured', False)))
          print('Database configured:', features.get('database', False))
          print('Video service configured:', features.get('videoAvatar', False))
          PY
            else
              echo "$host: health endpoint unavailable"
            fi
          done
          echo "Checking deployed app and profile image"
          if curl --connect-timeout 10 --max-time 20 -fsS "https://wens-ai-backend-b142.naqashy1.workers.dev/" -o /tmp/wens-index.html; then
            if grep -q 'hero-portrait' /tmp/wens-index.html; then echo "Deployed app contains Wens portrait layout"; else echo "Deployed app is still an older version"; fi
          else
            echo "App homepage could not be downloaded"
          fi
          if curl --connect-timeout 10 --max-time 20 -fsS "https://wens-ai-backend-b142.naqashy1.workers.dev/avatar.jpg" -o /tmp/wens-avatar.jpg; then
            echo "Profile image is deployed; bytes: $(wc -c < /tmp/wens-avatar.jpg)"
          else
            echo "Profile image is not deployed to the live Worker yet"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate D1 migration
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect(':memory:')
          db.executescript(open('migrations/0001_initial.sql', encoding='utf-8').read())
          expected = {'users', 'sessions', 'messages'}
          actual = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert expected.issubset(actual), f"Missing tables: {expected - actual}"
          print("D1 schema validated:", ', '.join(sorted(expected)))
          PY
